<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embers of the Verdant Keep</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #06040a;
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: #f4ecd0;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    display: block;
    width: 1920px;
    height: 1080px;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 80px rgba(140, 90, 220, 0.2),
                0 0 30px rgba(255, 160, 60, 0.08) inset;
    background: #06040a;
  }
  /* Tip overlay shown briefly */
  #tip {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(244, 236, 208, 0.55);
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #tip.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1920" height="1080"></canvas>
</div>
<div id="tip">Arrows / WASD &nbsp;·&nbsp; SPACE jump &nbsp;·&nbsp; X / J attack &nbsp;·&nbsp; M mute</div>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/particles.js"></script>
<script src="js/assets.js"></script>
<script src="js/renderer.js"></script>
<script src="js/enemies.js"></script>
<script src="js/player.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
</body>
</html>
